# We use the reserved private subnet 10.0.0.0/8 (::ffff:a00:0/104)
# https://en.wikipedia.org/wiki/Reserved_IP_addresses
services:
  'signal-server':
    container_name: 'signal-server' # Run only testing or prod, never both
    profiles:
      - 'prod'
    build:
      context: '.'
      dockerfile: './docker/signal-server/Dockerfile'
      target: 'run'
    command: '-Dsecrets.bundle.filename=config/test-secrets-bundle.yml'
    env_file:
      - './docker/signal-server/.env'
    environment:
      - 'SIGNAL_SERVER_CONFIG=config/test.yml'
    secrets:
      - source: 'signal-server-secrets'
        target: '/usr/app/service/config/'
    networks:
      'signal-server':
      'mongo':
  'signal-server-testing':
    container_name: 'signal-server' # Run only testing or prod, never both
    profiles:
      - 'dev'
    build:
      context: '.'
      dockerfile: './docker/signal-server/Dockerfile'
      target: 'integration-tests'
    env_file:
      - './docker/signal-server/.env'
    secrets:
      - source: 'signal-server-secrets'
        target: '/usr/app/service/config/'
    networks:
      'signal-server':
      'mongo':
  'mongo':
    container_name: 'signal-mongo'
    restart: 'on-failure'
    mem_swappiness: 1 # Doesn't affect /proc/sys/vm/swappiness, so mongosh still gives a warning
    build:
      context: './docker/mongo'
      dockerfile: './Dockerfile'
      target: 'run'
    volumes:
      - 'signal-mongodb:/data/db'
      - 'signal-mongodb-config:/data/configdb'
    env_file:
      - './docker/mongo/.env'
    networks:
      'mongo':
  'mongo-debug':
    restart: 'on-failure'
    depends_on:
      - 'mongo'
    profiles:
      - 'debug'
    image: 'mongo-express:1.0.2'
    ports:
      - ':8081'
    env_file:
      - './docker/mongo/debug/.env'
    environment:
      # Theme demo:
      # https://codemirror.com/5/demo/theme.html#tomorrow-night-bright
      ME_CONFIG_OPTIONS_EDITORTHEME: 'tomorrow-night-bright'
    networks:
      'mongo':
volumes:
  'signal-mongodb':
  'signal-mongodb-config':
secrets:
  'signal-server-secrets':
    file: './service/config/'
networks:
  'signal-server':
    driver: 'bridge'
    enable_ipv4: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: '10.0.0.0/24' # 10.0.0.X
          gateway: '10.0.0.1'
  'mongo':
    driver: 'bridge'
    enable_ipv4: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: '10.0.1.0/24' # 10.0.1.X
          gateway: '10.0.1.1'
