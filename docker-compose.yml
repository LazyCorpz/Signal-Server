# We use the reserved private subnet 10.0.0.0/8 (::ffff:a00:0/104)
# https://en.wikipedia.org/wiki/Reserved_IP_addresses
services:
  'server-prod': # Signal server
    container_name: 'server' # Same name to disallow sharing containers
    profiles:
      - 'prod'
    depends_on:
      - 'metrics-adapter'
      - 'redis-cache-cluster'
      - 'redis-push-scheduler-cluster'
      - 'redis-rate-limiters-cluster'
      - 'redis-message-cache-cluster'
    restart: 'on-failure' # Server has built-in health checks
    build:
      context: '.'
      dockerfile: './docker/signal-server/Dockerfile'
      target: 'run'
    # ports:
    #   - ':8080' # Application
    #   - ':8081' # Admin
    environment:
      - 'SIGNAL_SERVER_CONFIG=config/test.yml'
    secrets:
      - source: 'signal'
        target: '/usr/app/service/config/'
    # sysctls:
    #   - 'net.ipv6.conf.all.disable_ipv6=0'
    network_mode: 'host'
  'server-dev': # Signal server
    container_name: 'server' # Same name to disallow sharing containers
    profiles:
      - 'dev'
    depends_on:
      - 'metrics-adapter'
      - 'redis-cache-cluster'
      - 'redis-push-scheduler-cluster'
      - 'redis-rate-limiters-cluster'
      - 'redis-message-cache-cluster'
    build:
      context: '.'
      dockerfile: './docker/signal-server/Dockerfile'
      target: 'run-test-server'
    # ports:
    #   - ':8080' # Application
    #   - ':8081' # Admin
    secrets:
      - source: 'signal'
        target: '/usr/app/service/config/'
      - source: 'test'
        target: '/usr/app/service/src/test/resources/config/'
    # sysctls:
    #   - 'net.ipv6.conf.all.disable_ipv6=0'
    network_mode: 'host'
  'metrics':
    container_name: 'metrics'
    image: 'prom/prometheus:v3.5.0'
    # ports:
    #   - ':9090'
    volumes:
      - type: 'bind'
        source: './docker/metrics/'
        target: '/etc/prometheus/'
      - type: 'volume'
        source: 'metrics'
        target: '/prometheus/'
    network_mode: 'host'
  'metrics-adapter':
    container_name: 'metrics-adapter'
    image: 'prom/statsd-exporter:v0.28.0'
    depends_on:
      'metrics':
        required: false
        condition: 'service_started'
    network_mode: 'service:metrics'
  'redis-cache-cluster':
    container_name: 'redis-cache-cluster'
    depends_on:
      - 'redis-cache-1'
      - 'redis-cache-2'
      - 'redis-cache-3'
      - 'redis-cache-4'
      - 'redis-cache-5'
      - 'redis-cache-6'
    build:
      context: './docker/redis/'
      dockerfile: './cluster.dockerfile'
    # 3 masters and 3 replicas, the minimal recommended cluster config
    command: >
      localhost:1000
      localhost:1001
      localhost:1002
      localhost:1003
      localhost:1004
      localhost:1005
    network_mode: 'host'
  'redis-cache-1':
    container_name: 'redis-cache-1'
    restart: 'always'
    build:
      context: './docker/redis/'
      dockerfile: './node.dockerfile'
    environment:
