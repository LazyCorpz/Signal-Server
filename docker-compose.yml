# We use the reserved private subnet 10.0.0.0/8 (::ffff:a00:0/104)
# https://en.wikipedia.org/wiki/Reserved_IP_addresses
services:
  'signal':
    container_name: 'server'
    depends_on:
      # - 'dynamodb'
      - 'metrics-adapter'
    build:
      context: '.'
      dockerfile: './docker/signal-server/Dockerfile'
      target: 'run'
    ports:
      - ':8080' # Application
      - ':8081' # Admin
    environment:
      - 'SIGNAL_SERVER_CONFIG=config/test.yml'
    secrets:
      - source: 'signal'
        target: '/usr/app/service/config/'
    sysctls:
      - 'net.ipv6.conf.all.disable_ipv6=0'
    networks:
      'signal':
        ipv4_address: '10.0.0.2'
  'test-server':
    container_name: 'test-server'
    profiles:
      - 'staging'
    depends_on:
      # - 'dynamodb'
      - 'metrics-adapter'
    build:
      context: '.'
      dockerfile: './docker/signal-server/Dockerfile'
      target: 'run-test-server'
    secrets:
      - source: 'signal'
        target: '/usr/app/service/config/'
    networks:
      'signal':
        ipv4_address: '10.0.0.253'
  'tests':
    container_name: 'tests'
    profiles:
      - 'dev'
    build:
      context: '.'
      dockerfile: './docker/signal-server/Dockerfile'
      target: 'integration-tests'
    networks:
      'signal':
        ipv4_address: '10.0.0.254'
  'dynamodb':
    container_name: 'dynamodb'
    image: 'amazon/dynamodb-local:3.0.0'
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath ./data'
    working_dir: '/home/dynamodblocal'
    ports:
      - ':8000'
    volumes:
      - type: 'volume'
        source: 'dynamodb'
        target: '/home/dynamodblocal/data'
  'metrics':
    container_name: 'metrics'
    image: 'prom/prometheus:v3.5.0'
    ports:
      - ':9090'
    volumes:
      - type: 'bind'
        source: './docker/metrics/'
        target: '/etc/prometheus/'
      - type: 'volume'
        source: 'metrics'
        target: '/prometheus'
    networks:
      'signal':
        ipv4_address: '10.0.0.3'
  'metrics-adapter':
    container_name: 'metrics-adapter'
    image: 'prom/statsd-exporter:v0.28.0'
    depends_on:
      'metrics':
        required: false
        condition: 'service_started'
    networks:
      'signal':
        ipv4_address: '10.0.0.4'
volumes:
  'dynamodb':
  'metrics':
secrets:
  'signal':
    file: './service/config/'
networks:
  'signal':
    driver: 'bridge'
    enable_ipv4: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: '10.0.0.0/24' # 10.0.0.X
          gateway: '10.0.0.1'
