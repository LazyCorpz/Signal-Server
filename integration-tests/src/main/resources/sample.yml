# Source: org.signal.integration

domain: '10.0.0.2:8080' # Server domain name
rootCert: '' # X.509 server certificate

# Syntax: https://github.com/coursera/metrics-datadog?tab=readme-ov-file#dropwizard-metrics-reporter
metrics:
  reporters:
    - type: signal-datadog
      frequency: 10 seconds
      tags:
        - "env:test"
        - "service:chat"
      udpTransport:
        statsdHost: 10.0.0.4
        port: 9125
      excludesAttributes:
        - m1_rate
        - m5_rate
        - m15_rate
        - mean_rate
        - stddev
      useRegexFilters: true
      excludes:
        - ^.+\.total$
        - ^.+\.request\.filtering$
        - ^.+\.response\.filtering$
        - ^executor\..+$
        - ^lettuce\..+$
  reportOnStop: true

dogstatsd:
  type: nowait
  environment: dev
  host: 10.0.0.4
  port: 9125

dynamoDbClient:
  region: 'us-east-1'
  clientExecutionTimeout: 'P60s' # Timeout duration
  clientRequestTimeout: 'P60s' # Timeout duration
  maxConnections: 5

dynamoDbTables:
  registrationRecovery: '' # Table names
  verificationSessions: 'VerificationSessionsTest' # Table names
  phoneNumberIdentifiers: '4a37d1f1-19d2-412e-a687-0677e00c311b' # UUID

prescribedRegistrationNumber: '+11234567890' # Phone number
prescribedRegistrationCode: 'abcd'
